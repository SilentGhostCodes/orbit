name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(grep -oP '^\s*flutter:\s*\^\K[0-9.]+' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The app code follows Hiddify's main branch, which builds against the core's rolling "draft"
      # release (Makefile, non-prod channel); the numbered core.version lags behind it.
      - name: Download the Hiddify core for Android
        run: |
          mkdir -p android/app/libs
          curl -fL "https://github.com/hiddify/hiddify-core/releases/download/draft/hiddify-lib-android.tar.gz" \
            | tar xz -C android/app/libs/

      - name: Code generation
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      # Without these secrets the APK is signed with a throwaway debug key, and each build then
      # needs the previous one uninstalled first. See README.
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        if: env.KEY != ''
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          {
            echo "storeFile=$(pwd)/android/key.jks"
            echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } > android/key.properties

      - name: Build
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target lib/main_prod.dart 2>&1 | tee build.log

      # Annotations are readable through the API even where the raw log is not.
      - name: Report build errors
        if: failure()
        run: |
          grep -E -i -B2 -A8 "error|what went wrong|exception|failed" build.log | tail -n 120 > errors.txt || true
          [ -s errors.txt ] || tail -n 120 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=flutter build apk::${msg}"

      - name: Collect
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Orbit-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Orbit-arm7.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/Orbit-x86_64.apk || true

      - uses: actions/upload-artifact@v5
        with:
          name: Orbit-android
          path: out/*.apk

      # Every build on main becomes a release, so the APK is one tap away on the phone.
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Orbit build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: Для телефона нужен Orbit-arm64.apk.
          files: out/*.apk

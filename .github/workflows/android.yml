name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Xray-core for Android: XTLS's libXray at core/LIBXRAY_COMMIT plus core/libxray, built with gomobile.
  # Cached until those change.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cached libXray
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: core-out
          key: libxray-android-${{ hashFiles('core/LIBXRAY_COMMIT', 'core/libxray/**') }}

      - name: Check out libXray
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/XTLS/libXray libxray-src
          git -C libxray-src checkout "$(cat core/LIBXRAY_COMMIT)"
          # Orbit's additions: ping with a chosen method and mode
          cp core/libxray/orbit.go libxray-src/
          cp core/libxray/xray/*.go libxray-src/xray/

      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version-file: libxray-src/go.mod
          cache-dependency-path: libxray-src/go.sum

      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: zulu
          java-version: 17

      - uses: nttld/setup-ndk@v1
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        with:
          ndk-version: r28

      - name: Build libXray.aar
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: libxray-src
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          python3 build/main.py android 2>&1 | tee "$GITHUB_WORKSPACE/core.log"
          mkdir -p ../core-out
          cp libXray.aar ../core-out/
          ls -la ../core-out

      - name: Report core errors
        if: failure()
        run: |
          touch core.log
          tail -n 120 core.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=libXray::${msg}"

      - uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: core-out
          key: libxray-android-${{ hashFiles('core/LIBXRAY_COMMIT', 'core/libxray/**') }}

      - uses: actions/upload-artifact@v5
        with:
          name: libxray-android
          path: core-out/libXray.aar
          retention-days: 1

  apk:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: actions/download-artifact@v5
        with:
          name: libxray-android
          path: android/app/libs

      # Fresh geo lists for the subscription's routing, trimmed to what fits in an APK.
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/geotrim/go.mod
          cache-dependency-path: core/geotrim/go.sum

      - name: Geo lists
        run: |
          set -e
          mkdir -p geo-src
          base=https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download
          for f in geosite geoip; do
            curl -fsSL --retry 4 -o "geo-src/$f.dat" "$base/$f.dat"
            (cd core/geotrim && go run . -in "../../geo-src/$f.dat" -out "../../assets/xray/$f.dat" \
              -rules "../geo/$f.rules" -manifest "../../assets/xray/$f.txt")
          done
          ls -la assets/xray

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test test/parser_test.dart test/ping_test.dart test/emit_configs_test.dart test/incy_link_test.dart

      # Without these secrets every build is signed with a throwaway debug key, and installing one
      # over another fails. See README.
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        if: env.KEY != ''
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/orbit.jks
          {
            echo "storeFile=$(pwd)/android/orbit.jks"
            echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}"
          } > android/key.properties

      - name: Version
        id: version
        run: echo "name=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          {
            flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}
            mkdir -p out
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Orbit-arm64.apk
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Orbit-arm7.apk
            # one APK for every phone, for the ones that reject the arm64 build
            flutter build apk --release --build-number=${{ github.run_number }}
            cp build/app/outputs/flutter-apk/app-release.apk out/Orbit-universal.apk
          } 2>&1 | tee build.log
          ls -la out

      # Annotations are readable through the API even where the raw log is not.
      - name: Report build errors
        if: failure()
        run: |
          touch build.log
          grep -E -i -B2 -A8 "error|what went wrong|exception|failed" build.log | tail -n 120 > errors.txt || true
          [ -s errors.txt ] || tail -n 120 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=flutter build apk::${msg}"

      - uses: actions/upload-artifact@v5
        with:
          name: Orbit-android
          path: out/*.apk

      # Every build on main becomes a release, so the APK is one tap away on the phone.
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-build{1}', steps.version.outputs.name, github.run_number) }}
          name: ${{ format('Orbit {0}', steps.version.outputs.name) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Для большинства телефонов — Orbit-arm64.apk.
            Если не ставится («не удалось проанализировать») — Orbit-universal.apk.
          files: out/*.apk
